<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Droply</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 320px;
        background: #0b0d12;
        color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-size: 14px;
      }
      .wrap { padding: 16px; }
      .brand {
        display: flex; align-items: center; gap: 8px;
        font-weight: 700; font-size: 16px; margin-bottom: 12px;
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #22c55e; box-shadow: 0 0 8px #22c55e80;
      }
      .card {
        background: #12151c; border: 1px solid #222632;
        border-radius: 10px; padding: 12px; margin-bottom: 10px;
      }
      .label { color: #8b93a7; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
      .value { font-weight: 600; margin-top: 2px; }
      button, .btn {
        display: block; width: 100%; padding: 10px 12px;
        border: none; border-radius: 8px; cursor: pointer;
        font-weight: 600; font-size: 14px;
        background: #22c55e; color: #0b0d12;
        text-decoration: none; text-align: center;
      }
      button:hover, .btn:hover { background: #16a34a; }
      .btn-secondary {
        background: #171b24; color: #e6e8ee; border: 1px solid #222632;
      }
      .row { display: flex; justify-content: space-between; align-items: center; }
      .muted { color: #8b93a7; }
      .stack > * + * { margin-top: 8px; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span> Droply</div>

      <div id="logged-in" class="hidden stack">
        <div class="card">
          <div class="label">eBay Store</div>
          <div class="value" id="ebay-username">—</div>
        </div>
        <div class="card">
          <div class="row">
            <div>
              <div class="label">Imports today</div>
              <div class="value" id="today-count">0</div>
            </div>
            <div class="muted" id="today-date"></div>
          </div>
        </div>
        <a class="btn" id="dashboard-link" href="#" target="_blank">Go to Dashboard</a>
        <button class="btn-secondary" id="logout-btn">Log out</button>
      </div>

      <div id="logged-out" class="hidden stack">
        <div class="card">
          <div class="value">Not logged in</div>
          <div class="muted" style="margin-top: 4px;">
            Log in to your Droply account to import Amazon products to eBay.
          </div>
        </div>
        <a class="btn" id="login-link" href="#" target="_blank">Log in to Droply</a>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
