<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Droply</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; padding: 0; width: 360px; max-height: 540px; overflow: hidden;
        background: #0b0d12; color: #e6e8ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        font-size: 14px;
      }
      .wrap { padding: 14px; }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e80; }

      .summary {
        display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;
      }
      .stat {
        background: #12151c; border: 1px solid #222632; border-radius: 10px; padding: 10px;
      }
      .label { color: #8b93a7; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
      .value { font-weight: 700; margin-top: 2px; font-size: 18px; }

      .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .muted { color: #8b93a7; font-size: 12px; }

      .list { max-height: 300px; overflow-y: auto; padding-right: 2px; }
      .list::-webkit-scrollbar { width: 6px; }
      .list::-webkit-scrollbar-thumb { background: #2a2f3d; border-radius: 4px; }

      .item {
        display: flex; gap: 10px; align-items: center;
        background: #12151c; border: 1px solid #222632; border-radius: 10px;
        padding: 8px; margin-bottom: 6px;
      }
      .item img {
        width: 44px; height: 44px; border-radius: 6px; object-fit: contain;
        background: #fff; flex-shrink: 0;
      }
      .item .body { flex: 1; min-width: 0; }
      .item .title {
        font-size: 12.5px; font-weight: 600;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .item .meta { font-size: 11.5px; color: #8b93a7; margin-top: 2px; }
      .item a { color: #22c55e; text-decoration: none; font-size: 11.5px; }
      .item a:hover { text-decoration: underline; }
      .remove {
        background: none; border: none; color: #8b93a7; cursor: pointer; padding: 4px;
      }
      .remove:hover { color: #fca5a5; }

      .actions { display: flex; gap: 8px; margin-top: 10px; }
      .btn {
        flex: 1; padding: 9px 10px; border: none; border-radius: 8px;
        cursor: pointer; font-weight: 600; font-size: 13px;
        background: #22c55e; color: #0b0d12; text-align: center;
      }
      .btn:hover { background: #16a34a; }
      .btn-secondary { background: #171b24; color: #e6e8ee; border: 1px solid #222632; }
      .btn-secondary:hover { background: #1f2530; }

      .empty {
        text-align: center; padding: 22px 10px; color: #8b93a7;
        background: #12151c; border: 1px dashed #222632; border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span> Droply</div>

      <div class="summary">
        <div class="stat">
          <div class="label">Saved today</div>
          <div class="value" id="today-count">0</div>
        </div>
        <div class="stat">
          <div class="label">In library</div>
          <div class="value" id="total-count">0</div>
        </div>
      </div>

      <div class="list-head">
        <div class="muted">Recent imports</div>
        <button id="export-btn" class="remove" title="Copy all as JSON">Copy JSON</button>
      </div>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" style="display:none;">
        Visit any Amazon product page and click <b>Save product (Droply)</b>.
      </div>

      <div class="actions">
        <button id="library-btn" class="btn">Open library</button>
        <button id="dashboard-btn" class="btn btn-secondary">Open dashboard</button>
      </div>
      <div class="actions" style="margin-top: 6px;">
        <button id="amazon-btn" class="btn btn-secondary" style="flex: 1;">Open Amazon</button>
        <button id="clear-btn" class="btn btn-secondary" style="flex: 1;">Clear all</button>
      </div>

      <div style="margin-top: 10px; background: #12151c; border: 1px solid #222632; border-radius: 8px; padding: 10px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
          <div>
            <div style="font-size: 12px; font-weight: 600;">Auto-recheck</div>
            <div id="recheck-status" class="muted" style="font-size: 11px; margin-top: 2px;">Idle</div>
          </div>
          <button id="recheck-now-btn" class="btn" style="flex: 0 0 auto; padding: 7px 12px; font-size: 12px;">Recheck all</button>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; margin-top: 8px;">
          <label class="muted" style="font-size: 11px;" for="recheck-interval">Every</label>
          <select id="recheck-interval" style="background: #171b24; color: #e6e8ee; border: 1px solid #222632; border-radius: 6px; padding: 4px 6px; font-size: 12px;">
            <option value="60">1 hour</option>
            <option value="180">3 hours</option>
            <option value="360" selected>6 hours</option>
            <option value="720">12 hours</option>
            <option value="1440">24 hours</option>
          </select>
          <span class="muted" style="font-size: 11px;">in the background</span>
        </div>
      </div>

      <details style="margin-top: 10px; background: #12151c; border: 1px solid #222632; border-radius: 8px; padding: 8px 10px;">
        <summary style="color: #8b93a7; cursor: pointer; font-size: 12px;">Backend URL</summary>
        <input
          id="backend-url"
          type="url"
          placeholder="http://localhost:8000"
          style="width: 100%; box-sizing: border-box; margin-top: 6px; padding: 7px 8px; background: #171b24; color: #e6e8ee; border: 1px solid #222632; border-radius: 6px; font-size: 12px;"
        />
        <button id="save-backend-btn" class="btn" style="width: 100%; margin-top: 6px; padding: 6px; font-size: 12px;">Save</button>
      </details>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
